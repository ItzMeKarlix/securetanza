<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline | Secure Tanza</title>
<script>
  // Same theme choice as the app (app/layout.tsx).
  try {
    if (localStorage.theme === "light" || (!("theme" in localStorage) && matchMedia("(prefers-color-scheme: light)").matches)) {
      document.documentElement.dataset.theme = "light";
    }
  } catch (_) {}
</script>
<style>
  :root {
    --bg: #0b1120;
    --surface: #0f172a;
    --border: rgba(255, 255, 255, 0.08);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #0ea5e9;
    --accent-text: #0b1120;
    --warn: #fbbf24;
    --warn-bg: rgba(245, 158, 11, 0.12);
  }
  :root[data-theme="light"] {
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #475569;
    --accent: #0369a1;
    --accent-text: #ffffff;
    --warn: #b45309;
    --warn-bg: #fef3c7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%;
    max-width: 420px;
    padding: 28px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--surface);
  }
  .icon {
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border-radius: 999px;
    background: var(--warn-bg);
    color: var(--warn);
  }
  h1 { margin: 16px 0 6px; font-size: 18px; font-weight: 700; }
  p { margin: 0 0 10px; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  button, a {
    flex: 1 1 140px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font: inherit;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
  }
  button { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  a { background: transparent; color: var(--text); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.43"/><path d="M2 8.82a15 15 0 0 1 4.18-2.64"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/></svg>
  </div>
  <h1>You're offline</h1>
  <p>This page hasn't been opened on this device yet, so there's no saved copy to show.</p>
  <p>Pages you've already opened while signed in, like the map, still work offline with the data saved when you last viewed them.</p>
  <div class="actions">
    <button type="button" onclick="location.reload()">Try again</button>
    <a href="/">Open the map</a>
  </div>
</main>
<script>
  // Pick up where they were as soon as the connection is back.
  addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
